  carousel_slider: ^5.0.0
  go_router: ^16.0.0
  get: any
  getx_helper: ^0.0.1

  scrollview_observer:
    path: ../

  material_ui: ^1.2.0
  extended_list: ^3.0.2
  cupertino_ui: ^1.0.2
  collection: ^1.19.1
dependency_overrides:
  get:
