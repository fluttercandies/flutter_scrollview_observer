version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  video_player: ^2.4.2
  waterfall_flow: ^3.0.2
  loading_more_list: ^5.0.3
  easy_refresh: ^3.3.2+4
  visibility_detector: ^0.4.0+2
